name: "Run Container Scan on Super Mario Docker Image with Quality Gate"

on:
  push:
    branches:
      - main

jobs:
  run_container_image_scan_on_supermario_docker_image:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Calculate Version
        id: version
        run: |
          VERSION=$(($(cat version.txt) + 1))
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Docker Image for Scan
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/supermariogitopsproject:${{ env.VERSION }}
          docker build -t $IMAGE_NAME .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/supermariogitopsproject:${{ env.VERSION }}
          format: 'table'
          exit-code: '0'   # Always succeed, even if vulnerabilities are found
          severity: 'CRITICAL,HIGH'

      - name: Report Vulnerabilities
        run: |
          echo "Trivy scan completed. Vulnerabilities may exist, but pipeline will continue."
